; ESP32 인터넷 스트리밍 FM 라디오 — 보드 셋을 한 저장소에서 빌드한다.
;
;   epaper   Waveshare ESP32-S3-ePaper-1.54 (V2)
;   sticks3  M5Stack M5StickS3
;   p4       Waveshare ESP32-P4-WIFI6-Touch-LCD-3.5
;
; 앞의 둘은 MCU 가 ESP32-S3-PICO-1-N8R8 로 같다. P4 는 다른 칩(RISC-V,
; 32MB PSRAM / 16MB Flash)이고 무선을 옆의 ESP32-C6 가 SDIO 로 대신한다.
; 오디오 코덱은 셋 다 ES8311 이라 스트리밍 경로는 공유한다.
;
; 공통 코드는 src/common/, 보드별 코드는 src/boards/<보드>/ 에 둔다.
; build_src_filter 로 해당 보드 디렉터리만 골라 넣는다.

[platformio]
default_envs = epaper

; ── 모든 보드가 공유하는 설정 ────────────────────────────────────
[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    -Isrc/common
    -std=gnu++2a
build_unflags =
    -std=gnu++11
    -std=gnu++17

; lib_ldf_mode 는 기본값(chain+)을 쓴다. deep+ 로 두면 Arduino core 3.x 의
; 내장 WiFi 가 의존하는 Network 라이브러리를 못 찾아 빌드가 깨진다.
lib_deps =
    https://github.com/schreibfaul1/ESP32-audioI2S.git#4.0.0

; ── ESP32-S3 보드 둘의 공통 ──────────────────────────────────────
[s3]
extends = common
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
; N8R8 = 8MB quad flash + 8MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
; S3 는 네이티브 USB 로 로그를 찍는다
build_flags =
    ${common.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ── Waveshare ePaper 보드 ────────────────────────────────────────
[env:epaper]
extends = s3
build_src_filter = +<common/> +<boards/epaper/>
build_flags =
    ${s3.build_flags}
    -Isrc/boards/epaper
    -DBOARD_EPAPER=1
lib_deps =
    ${common.lib_deps}
    zinggjm/GxEPD2@^1.6.9
    adafruit/Adafruit GFX Library@^1.11.11
upload_protocol = esptool
upload_port = COM5
monitor_port = COM5

; 무선 업데이트. OTA 가 들어간 펌웨어를 USB 로 한 번 올린 뒤부터 쓸 수 있다.
; upload_port 는 호스트네임이 아니라 IP 로 적는다 — ISP 가 없는 도메인을 자기
; 광고 페이지로 돌려버려서 .local 질의가 엉뚱한 공인 IP 로 새어 나간다.
[env:epaper-ota]
extends = env:epaper
upload_protocol = espota
upload_port = 192.168.68.81
upload_flags = --auth=fmradio-ota

; ── M5Stack M5StickS3 ────────────────────────────────────────────
; 화면(ST7789P3) · 전원관리(M5PM1) · 앰프(AW8737 펄스 제어) · IMU(BMI270)를
; 직접 다루지 않고 M5Unified 에 맡긴다. 벤더가 이 하드웨어에서 검증한 HAL 이다.
[env:sticks3]
extends = s3
build_src_filter = +<common/> +<boards/sticks3/>
build_flags =
    ${s3.build_flags}
    -Isrc/boards/sticks3
    -DBOARD_STICKS3=1
lib_deps =
    ${common.lib_deps}
    m5stack/M5Unified@^0.2.7
upload_protocol = esptool
upload_port = COM8
monitor_port = COM8

; ── Waveshare ESP32-P4-WIFI6-Touch-LCD-3.5 ───────────────────────
; 이 개체의 칩은 ESP32-P4 rev v1.3 이다 (esptool flash_id 로 확인). rev1.x 와
; rev3.x 는 SDK 라이브러리가 다르고(esp32p4_es / esp32p4) 서로 바꿔 올리면 안
; 된다. rev3 보드를 받으면 board 를 esp32-p4_r3, f_cpu 를 400MHz 로 바꾼다.
; 32MB PSRAM(hex, 200MHz), 16MB flash.
; Wi-Fi 는 ESP32-C6 가 SDIO 로 대신한다 — Arduino 3.3 의 P4 sdkconfig 에
; ESP-Hosted 가 켜져 있고 SDIO 핀도 이 보드와 같아서 따로 지정하지 않는다.
;
; 화면은 Arduino_GFX(ST7796 SPI 80MHz)를 쓰되 버스는 벤더 예제와 다르다 —
; Arduino_ESP32SPI(레지스터 직접 제어). 벤더의 Arduino_HWSPI 는 한 장 2.5초,
; DMA 버스는 패널을 못 그렸다. 자세한 것은 src/boards/p4/config.h 의 LCD_BUS.
; 큰 숫자용 폰트만 Adafruit GFX 에서 빌려 온다(형식이 같다).
; 로그는 USB CDC 가 아니라 UART0 -> CH343 브리지로 나간다.
[env:p4]
extends = common
board = esp32-p4
board_build.mcu = esp32p4
board_build.f_cpu = 360000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_src_filter = +<common/> +<boards/p4/>
; C6(Wi-Fi 코프로세서) 펌웨어를 P4 펌웨어에 함께 굽는다. Arduino 코어가 호스트
; 라이브러리와 같은 버전의 슬레이브 바이너리를 hosted/ 에 넣어 두므로 그것을
; 그대로 가리킨다 — 코어를 올리면 둘이 같이 올라간다. board_build.embed_files
; 는 심볼에 경로가 붙고 .data 로 들어가서 못 쓴다. tools/p4_c6fw.py 참고.
extra_scripts = pre:tools/p4_c6fw.py
build_flags =
    ${common.build_flags}
    -Isrc/boards/p4
    -DBOARD_P4=1
    ; LCD_BUS 를 1(DMA)로 실험할 때만 의미 있는 값. 한 번에 보내는 픽셀 수.
    -DESP32SPIDMA_MAX_PIXELS_AT_ONCE=4096
lib_deps =
    ${common.lib_deps}
    moononournation/GFX Library for Arduino@^1.6.0
    adafruit/Adafruit GFX Library@^1.11.11
    lewisxhe/XPowersLib
upload_protocol = esptool
upload_speed = 921600
upload_port = COM10
monitor_port = COM10
