; ESP32-S3 인터넷 스트리밍 FM 라디오 — 두 보드를 한 저장소에서 빌드한다.
;
;   epaper   Waveshare ESP32-S3-ePaper-1.54 (V2)
;   sticks3  M5Stack M5StickS3
;
; MCU 는 둘 다 ESP32-S3-PICO-1-N8R8 (8MB Flash / 8MB Octal PSRAM) 로 같고,
; 오디오 코덱도 ES8311 로 같다. 다른 것은 화면 · 전원관리 · 버튼 · 센서다.
;
; 공통 코드는 src/common/, 보드별 코드는 src/boards/<보드>/ 에 둔다.
; build_src_filter 로 해당 보드 디렉터리만 골라 넣는다.

[platformio]
default_envs = epaper

; ── 두 보드가 공유하는 설정 ──────────────────────────────────────
[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
; N8R8 = 8MB quad flash + 8MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    -Isrc/common
    -std=gnu++2a
build_unflags =
    -std=gnu++11
    -std=gnu++17

; lib_ldf_mode 는 기본값(chain+)을 쓴다. deep+ 로 두면 Arduino core 3.x 의
; 내장 WiFi 가 의존하는 Network 라이브러리를 못 찾아 빌드가 깨진다.
lib_deps =
    https://github.com/schreibfaul1/ESP32-audioI2S.git#4.0.0

; ── Waveshare ePaper 보드 ────────────────────────────────────────
[env:epaper]
extends = common
build_src_filter = +<common/> +<boards/epaper/>
build_flags =
    ${common.build_flags}
    -Isrc/boards/epaper
    -DBOARD_EPAPER=1
lib_deps =
    ${common.lib_deps}
    zinggjm/GxEPD2@^1.6.9
    adafruit/Adafruit GFX Library@^1.11.11
upload_protocol = esptool
upload_port = COM5
monitor_port = COM5

; 무선 업데이트. OTA 가 들어간 펌웨어를 USB 로 한 번 올린 뒤부터 쓸 수 있다.
; upload_port 는 호스트네임이 아니라 IP 로 적는다 — ISP 가 없는 도메인을 자기
; 광고 페이지로 돌려버려서 .local 질의가 엉뚱한 공인 IP 로 새어 나간다.
[env:epaper-ota]
extends = env:epaper
upload_protocol = espota
upload_port = 192.168.68.81
upload_flags = --auth=fmradio-ota

; ── M5Stack M5StickS3 ────────────────────────────────────────────
; 화면(ST7789P3) · 전원관리(M5PM1) · 앰프(AW8737 펄스 제어) · IMU(BMI270)를
; 직접 다루지 않고 M5Unified 에 맡긴다. 벤더가 이 하드웨어에서 검증한 HAL 이다.
[env:sticks3]
extends = common
build_src_filter = +<common/> +<boards/sticks3/>
build_flags =
    ${common.build_flags}
    -Isrc/boards/sticks3
    -DBOARD_STICKS3=1
lib_deps =
    ${common.lib_deps}
    m5stack/M5Unified@^0.2.7
upload_protocol = esptool
upload_port = COM8
monitor_port = COM8
