; ESP32-S3-ePaper-1.54 (Waveshare, V2 / ESP32-S3-PICO-1-N8R8)
; 인터넷 스트리밍 FM 라디오
;
; 보드 확인 결과 (esptool):
;   Chip     : ESP32-S3-PICO-1 (LGA56) rev v0.2
;   Flash    : 8MB (embedded, quad)
;   PSRAM    : 8MB (AP_3v3, octal)
;   USB      : USB-Serial/JTAG (native CDC)

[env:epaper-radio]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
; N8R8 = 8MB quad flash + 8MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv

upload_protocol = esptool
upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct

build_flags =
    -DBOARD_HAS_PSRAM
    ; 보드에 USB-UART 브리지가 없고 S3 네이티브 USB를 그대로 씀
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; 3 = info. 선국 과정과 샘플레이트 전환이 시리얼에 찍힌다. 조용히 쓰려면 1로.
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    -std=gnu++2a
build_unflags =
    -std=gnu++11
    -std=gnu++17

; lib_ldf_mode 은 기본값(chain+)을 쓴다. deep+ 로 두면 Arduino core 3.x 의 내장
; WiFi 라이브러리가 의존하는 Network 라이브러리를 못 찾아 빌드가 깨진다.
lib_deps =
    https://github.com/schreibfaul1/ESP32-audioI2S.git#4.0.0
    zinggjm/GxEPD2@^1.6.9
    adafruit/Adafruit GFX Library@^1.11.11

; 무선 업데이트. OTA 가 들어간 펌웨어를 USB 로 한 번 올린 뒤부터 쓸 수 있다.
;   pio run -e epaper-radio-ota -t upload
; 호스트네임/비밀번호는 src/secrets.h 의 OTA_HOSTNAME / OTA_PASSWORD 와 맞춰야 한다.
[env:epaper-radio-ota]
extends = env:epaper-radio
upload_protocol = espota
; 호스트네임(esp32-radio.local) 대신 IP 를 쓴다. ISP 가 없는 도메인을 자기
; 광고 페이지로 돌려버려서 .local 질의가 mDNS 가 아니라 일반 DNS 로 새어
; 나가고, 엉뚱한 공인 IP 가 잡힌다.
; 공유기에서 MAC ac:27:6e:d3:0f:e0 에 고정 IP 를 주면 안 바뀐다.
upload_port = 192.168.68.81
upload_flags =
    --auth=fmradio-ota
